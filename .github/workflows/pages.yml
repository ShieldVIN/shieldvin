# Publish app/scan to GitHub Pages.
#
# The scan page is static by design (D11), so "deployment" is uploading the
# directory as-is - no build step exists to run. Serving from Pages keeps the
# judged URL next to the judged code: what reviewers browse is byte-for-byte
# what the repo holds.
name: Deploy scan page

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Compose the three surfaces the way the app server mounts them:
      # verification at the root, intake and proofs alongside. Statically the
      # console falls back to producing an intake file, and says so.
      - name: Compose site
        run: |
          mkdir _site
          cp app/scan/* _site/
          cp -r app/console _site/console
          cp -r app/proofs _site/proofs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
